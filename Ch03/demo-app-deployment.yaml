################################################################################
# Demo Application Kubernetes Deployment
#
# Purpose: Example application deployment with secure TLS configuration
# Components:
#   - Namespace for application isolation
#   - ServiceAccount with minimal permissions
#   - Deployment with security best practices
#   - Service for internal communication
#   - Ingress with TLS termination
#   - NetworkPolicy for traffic control
#   - PodDisruptionBudget for high availability
#
# Usage: kubectl apply -f demo-app-deployment.yaml
################################################################################

---
# Namespace for demo application
# Required labels enforced by constraint-namespace-labels.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    name: demo-app
    team: platform
    environment: prod
    cost-center: "10001"
    istio-injection: enabled    # Auto-inject Envoy sidecar for mTLS

---
# ServiceAccount for demo app
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app-sa
  namespace: demo-app
  labels:
    app: demo-app
    component: service-account

---
# ConfigMap: Application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-config
  namespace: demo-app
  labels:
    app: demo-app
    component: configuration
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"

---
# Secret: Application secrets (base64 encoded)
# WARNING: In production, use external secret management (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: demo-app-secrets
  namespace: demo-app
  labels:
    app: demo-app
    component: secrets
type: Opaque
stringData:
  # Example credentials - CHANGE IN PRODUCTION
  API_KEY: "demo-api-key-change-me-in-production"
  DATABASE_PASSWORD: "demo-db-password-change-me"
  JWT_SECRET: "demo-jwt-secret-change-me-in-production"

---
# Deployment: Demo application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-app
  labels:
    app: demo-app
    version: "1.0"
    component: application
spec:
  replicas: 3
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: demo-app
  
  template:
    metadata:
      labels:
        app: demo-app
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9898"
        prometheus.io/path: "/metrics"
    
    spec:
      # Use dedicated service account
      serviceAccountName: demo-app-sa
      
      # Security: Run as non-root user
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      
      # Affinity rules for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - demo-app
                topologyKey: kubernetes.io/hostname
      
      # Termination grace period
      terminationGracePeriodSeconds: 30
      
      containers:
        - name: demo-app
          # podinfo: a small Go app with real /healthz, /readyz and /metrics endpoints.
          # Specific version (not 'latest'); ghcr.io/ is on the allowed-registries
          # list (Ch02 platform-services.yaml).
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          imagePullPolicy: IfNotPresent

          # Container ports (podinfo serves HTTP and /metrics on 9898 by default)
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Environment variables
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: demo-app-config
                  key: APP_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: demo-app-config
                  key: LOG_LEVEL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-app-secrets
                  key: API_KEY
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-app-secrets
                  key: DATABASE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-app-secrets
                  key: JWT_SECRET
          
          # Volume mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          # Resource requests and limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          # Liveness probe: Check if app is alive
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Readiness probe: Check if app can accept traffic
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          # Startup probe: Check initial startup (slower)
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
      
      # Volumes
      volumes:
        - name: tmp
          emptyDir: {}

---
# Service: ClusterIP for internal communication
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo-app
  labels:
    app: demo-app
    component: service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 9898
      protocol: TCP
  selector:
    app: demo-app

---
# cert-manager Certificate: automatic TLS for demo-app via Let's Encrypt.
# cert-manager handles the ACME challenge, stores the certificate in a
# Kubernetes Secret, and renews it 30 days before expiry automatically.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-app-cert
  namespace: istio-system    # Must be in istio-system for Istio Gateway to reference it
  labels:
    app: demo-app
spec:
  secretName: demo-app-tls
  duration: 2160h     # 90 days
  renewBefore: 720h   # Renew 30 days before expiry
  dnsNames:
    - demo-app.example.com
    - www.demo-app.example.com
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer

---
# Istio Gateway: replaces nginx Ingress — receives inbound traffic on port 80/443.
# Teams annotate this Gateway resource to control routing from the company domain.
# Defined once by the platform team; dev teams only manage VirtualService entries.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: demo-app-gateway
  namespace: istio-system
  labels:
    app: demo-app
spec:
  selector:
    istio: ingressgateway    # Routes through the istio-ingress pod deployed in Ch2
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: demo-app-tls    # References the cert-manager Certificate above
      hosts:
        - demo-app.example.com
        - www.demo-app.example.com
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - demo-app.example.com
        - www.demo-app.example.com
      tls:
        httpsRedirect: true    # Redirect all HTTP to HTTPS automatically

---
# Istio AuthorizationPolicy: let external traffic for demo-app through the gateway.
# Ch02's istio-system/allow-external only admits /health, /ready and /api/* from
# the application namespace, so every other request to the gateway gets 403.
# ALLOW policies are additive: this admits only the demo-app hosts and leaves
# the Ch02 rules for all other traffic untouched.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: demo-app-allow-gateway
  namespace: istio-system
  labels:
    app: demo-app
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts:
              - demo-app.example.com
              - www.demo-app.example.com

---
# Istio VirtualService: routes traffic entering the Gateway to the demo-app Service.
# Teams define their own VirtualService pointing at the shared Gateway — this is
# the only Istio resource a dev team needs to manage for external routing.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: demo-app
  namespace: demo-app
  labels:
    app: demo-app
spec:
  hosts:
    - demo-app.example.com
    - www.demo-app.example.com
  gateways:
    - istio-system/demo-app-gateway
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: demo-app.demo-app.svc.cluster.local
            port:
              number: 80
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s

---
# NetworkPolicy: Restrict traffic to demo-app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-app-network-policy
  namespace: demo-app
  labels:
    app: demo-app
    component: network-policy
spec:
  podSelector:
    matchLabels:
      app: demo-app
  
  policyTypes:
    - Ingress
    - Egress
  
  # Allow ingress from ingress controller
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 9898

  # Allow egress to DNS and external services
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS outbound
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    # Allow the Istio sidecar to reach istiod (xDS config + workload certificates)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012

---
# PodDisruptionBudget: Ensure availability during maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-app-pdb
  namespace: demo-app
  labels:
    app: demo-app
    component: pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: demo-app

---
# HorizontalPodAutoscaler: Auto-scale based on CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-app-hpa
  namespace: demo-app
  labels:
    app: demo-app
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

################################################################################
# Verification Commands
#
# Check deployment status:
#   kubectl get deployment -n demo-app
#   kubectl describe deployment demo-app -n demo-app
#
# Check service:
#   kubectl get service -n demo-app
#
# Check Istio routing:
#   kubectl get gateway -n istio-system
#   kubectl get virtualservice -n demo-app
#   kubectl describe virtualservice demo-app -n demo-app
#
# Check certificate:
#   kubectl get certificate -n istio-system
#   kubectl describe certificate demo-app-cert -n istio-system
#
# Check pod status:
#   kubectl get pods -n demo-app -o wide
#   kubectl logs -n demo-app <pod-name>
#
# Test access:
#   curl -k https://demo-app.example.com
#   kubectl port-forward -n demo-app svc/demo-app 8080:80
#
################################################################################
