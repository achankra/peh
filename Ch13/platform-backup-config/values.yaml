# Velero Helm Chart Values for Platform Backup Configuration
#
# This values file configures a production-ready Velero deployment with:
# - MinIO as S3-compatible local object storage (runs inside Kind)
# - Daily and hourly backup schedules with retention policies
# - Resource filtering and backup hooks
# - Monitoring and alerting integration
#
# No cloud provider required — everything runs locally on Kind.
#
# Written against the vmware-tanzu/velero chart 12.x (Velero 1.18). Verify with:
#   helm template velero vmware-tanzu/velero -n velero -f platform-backup-config/values.yaml
#
# Installation:
#   helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
#   helm install velero vmware-tanzu/velero -n velero -f platform-backup-config/values.yaml
#
# With the Ch03/Ch11 Gatekeeper policies active, create the velero namespace first
# with team/environment/cost-center labels (see Step 2.1) instead of --create-namespace.
# Every container in this file sets resource limits and uses a docker.io/ or
# registry.k8s.io image for the same reason.

# ============================================================================
# Velero Core Configuration
# ============================================================================

# Image configuration
image:
  repository: docker.io/velero/velero
  tag: v1.18.2
  pullPolicy: IfNotPresent

# The service account is created by the chart (serviceAccount.server.create: true by default)

# Provider plugin: the AWS plugin speaks the S3 API that MinIO implements
initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.8.0
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
      - mountPath: /target
        name: plugins

# ============================================================================
# Velero Server Configuration
# ============================================================================

configuration:
  # ==========================================================================
  # Backup Storage Configuration — MinIO (S3-compatible)
  # ==========================================================================
  # Backup storage location (primary) — MinIO inside the cluster
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero-backups
      prefix: velero

      # MinIO S3-compatible configuration
      config:
        # MinIO endpoint inside the cluster
        s3Url: http://minio.velero.svc.cluster.local:9000

        # Region is required by the plugin but arbitrary for MinIO
        region: us-east-1

        # Path-style required for MinIO
        s3ForcePathStyle: "true"

        # Disable TLS for local MinIO
        insecureSkipTLSVerify: "true"

      # Credentials come from the secret named under `credentials` below
      credential:
        name: velero-minio-credentials
        key: cloud

      # Validation settings
      validationFrequency: 12h
      accessMode: ReadWrite
      default: true

  # Volume snapshots disabled — using file-level backups (kopia)
  # (Kind does not support CSI volume snapshots out of the box)
  volumeSnapshotLocation: []

  # Server log level
  logLevel: info

  # Use file-level backups (kopia) by default
  defaultVolumesToFsBackup: true

  # Defaults for restore operations (comma-separated, highest priority first)
  restoreResourcePriorities: "customresourcedefinitions,namespaces,clusterrolebindings,clusterroles,storageclasses,persistentvolumes,persistentvolumeclaims,serviceaccounts,secrets,configmaps,deployments.apps,daemonsets.apps,statefulsets.apps"

# File-level backups run through the node-agent DaemonSet
deployNodeAgent: true
nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ============================================================================
# Backup Schedules Configuration
# ============================================================================

schedules:
  # Daily backup schedule - runs at 2:00 AM UTC
  daily-backup:
    schedule: "0 2 * * *"
    template:
      storageLocation: default

      # Include specific namespaces
      includedNamespaces:
        - team-alpha
        - team-beta
        - production

      # Exclude system namespaces
      excludedNamespaces:
        - kube-system
        - kube-public
        - kube-node-lease
        - velero

      # Resource filtering (namespaced and cluster-scoped lists are separate;
      # they cannot be combined with includeClusterResources or excludedResources)
      includedNamespaceScopedResources:
        - deployments
        - daemonsets
        - statefulsets
        - pods
        - persistentvolumeclaims
        - configmaps
        - secrets
        - services
        - ingresses
        - networkpolicies

      # Cluster-scoped resources
      includedClusterScopedResources:
        - persistentvolumes
        - clusterrolebindings
        - clusterroles
        - storageclasses

      # File-level backup for PVs (kopia)
      snapshotVolumes: false
      defaultVolumesToFsBackup: true
      csiSnapshotTimeout: 10m

      # Retention policy - 30 days for daily backups
      ttl: 720h

      # Backup hooks for pre/post-backup operations
      hooks:
        resources:
          # Pre-backup: Database quiescing
          - name: db-quiesce
            includedNamespaces:
              - team-alpha
              - team-beta
            includedResources:
              - pods
            labelSelector:
              matchLabels:
                tier: database
            pre:
              - exec:
                  container: database
                  command:
                    - /bin/sh
                    - -c
                    - |
                      set +e
                      # Quiesce database for consistent backup
                      if command -v redis-cli &> /dev/null; then
                        redis-cli BGSAVE
                        sleep 2
                      fi
                      if command -v pg_dumpall &> /dev/null; then
                        echo "Flushing PostgreSQL buffers..."
                        psql -c "CHECKPOINT;"
                      fi
                      exit 0
                  timeout: 5m

          # Post-backup: Resume operations
          - name: db-resume
            includedNamespaces:
              - team-alpha
              - team-beta
            includedResources:
              - pods
            labelSelector:
              matchLabels:
                tier: database
            post:
              - exec:
                  container: database
                  command:
                    - /bin/sh
                    - -c
                    - |
                      echo "Resuming database operations..."
                      exit 0
                  timeout: 2m

      # Labels for backup organization
      metadata:
        labels:
          schedule-type: daily
          retention-policy: "30days"
          frequency: "daily"

  # Hourly backup for production namespace - runs every hour
  hourly-backup-production:
    schedule: "0 * * * *"
    template:
      storageLocation: default

      # Production only
      includedNamespaces:
        - production

      excludedNamespaces:
        - kube-system
        - kube-public
        - kube-node-lease
        - velero

      includeClusterResources: true
      snapshotVolumes: false
      defaultVolumesToFsBackup: true

      # Retention policy - 48 hours for hourly backups
      ttl: 48h

      # Faster timeout for hourly backups
      csiSnapshotTimeout: 5m

      metadata:
        labels:
          schedule-type: hourly
          retention-policy: "48hours"
          frequency: "hourly"

# ============================================================================
# Credentials Configuration — MinIO
# ============================================================================

credentials:
  useSecret: true
  # Use a pre-created secret (velero-storage-location.yaml creates it in Step 2.2)
  existingSecret: velero-minio-credentials

  # To create the secret by hand instead:
  # kubectl create secret generic velero-minio-credentials \
  #   --namespace velero \
  #   --from-file=cloud=./credentials-velero
  #
  # credentials-velero contents:
  #   [default]
  #   aws_access_key_id=minioadmin
  #   aws_secret_access_key=minioadmin

# ============================================================================
# Monitoring and Observability
# ============================================================================

metrics:
  # Prometheus metrics endpoint (port 8085)
  enabled: true
  scrapeInterval: 30s
  scrapeTimeout: 10s

  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

  # Alerts for Velero operations. The kube-prometheus-stack in this repo only loads
  # rules labelled release=kube-prometheus-stack.
  prometheusRule:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    spec:
      # Alert if 3 backups fail within an hour
      - alert: VeleroBackupFailure
        expr: increase(velero_backup_failure_total[1h]) >= 3
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Velero schedule {{ $labels.schedule }} had 3 or more failed backups in the last hour"

      # Alert if backups take longer than 30 minutes (p95)
      - alert: VeleroBackupSlow
        expr: histogram_quantile(0.95, sum by (le, schedule) (rate(velero_backup_duration_seconds_bucket[1h]))) > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Velero schedule {{ $labels.schedule }} p95 backup duration is over 30 minutes"

      # Alert if 2 restores fail within an hour
      - alert: VeleroRestoreFailure
        expr: increase(velero_restore_failed_total[1h]) >= 2
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Velero had 2 or more failed restores in the last hour"

      - alert: VeleroVolumeSnapshotFailure
        expr: increase(velero_volume_snapshot_failure_total[1h]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Velero volume snapshots are failing"

      # velero_backup_location_status_gauge: 1 = available, 0 = unavailable
      - alert: VeleroStorageLocationUnavailable
        expr: velero_backup_location_status_gauge == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Velero backup location {{ $labels.backup_location_name }} is unavailable"

# ============================================================================
# Pod and Node Configuration
# ============================================================================

# Pod security and resource limits
podSecurityContext:
  runAsUser: 0
  fsGroup: 0

containerSecurityContext:
  privileged: false
  readOnlyRootFilesystem: true
  runAsUser: 0

# Resource requests and limits (limits are required by the Gatekeeper policy)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# The CRD upgrade job (kubectl image from registry.k8s.io) also needs limits
upgradeJobResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Node selector removed — Kind nodes don't have custom labels
nodeSelector: {}

# Pod affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - velero
          topologyKey: kubernetes.io/hostname

# Tolerations for node taints
tolerations: []

# ============================================================================
# RBAC
# ============================================================================

rbac:
  create: true

# ============================================================================
# Notes
# ============================================================================

# The chart has no values for these; Velero handles them as follows:
# - Backup cleanup: expired backups are garbage-collected from each backup's `ttl`;
#   tune the frequency with configuration.garbageCollectionFrequency.
# - Encryption: not configurable here. Use server-side encryption on the object store
#   (disabled for local MinIO; enable it in production).
# - Replicas: Velero runs a single server pod (leader election is not supported).

# ============================================================================
# Post-Installation Verification
# ============================================================================

# Verification commands after installation
# Run: velero version
#      velero backup-location get
#      velero schedule get
#
# Create sample backup:
#   velero backup create manual-backup --wait
#
# List backups:
#   velero backup get
#
# Validate restore procedures:
#   ./restore-validation.sh --backup-name manual-backup
