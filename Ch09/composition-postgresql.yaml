# composition-postgresql.yaml
# Composition that implements the PostgreSQL XRD interface
# Deploys PostgreSQL as a StatefulSet inside the Kind cluster using
# the Crossplane Kubernetes provider — no cloud dependencies required.
#
# This uses the Crossplane v2 Composition pipeline mode with the
# function-patch-and-transform function, which replaces the legacy
# inline resources/patchSets syntax.
#
# CONNECTION SECRETS IN CROSSPLANE v2
# ------------------------------------
# In Crossplane v1, the XR's connection details were merged into one Secret that the
# claim controller copied into the claim's namespace (writeConnectionSecretToRef).
# Crossplane v2 removed that: the Composition no longer has
# writeConnectionSecretsToNamespace, so the XR gets no connection secret and the claim
# receives nothing, even though the claim CRD still accepts writeConnectionSecretToRef.
#
# This composition therefore composes the application's Secret itself
# (app-connection-secret below). Its name (<claim-name>-connection) and namespace are
# patched in from the claim via spec.claimRef. The connectionDetails entries on the
# other resources are kept for illustration; v2 does not publish them anywhere.

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgresql-kubernetes
  labels:
    provider: kubernetes
    database: postgresql
spec:
  compositeTypeRef:
    apiVersion: database.platform.io/v1alpha1
    kind: PostgreSQLInstance
  # Crossplane v2: writeConnectionSecretsToNamespace removed from Compositions;
  # see CONNECTION SECRETS above for how the app gets its credentials.
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        patchSets:
          - name: common-labels
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels
                toFieldPath: metadata.labels
          - name: tier-settings
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tier
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].resources.requests.memory
                transforms:
                  - type: map
                    map:
                      development: "256Mi"
                      staging: "512Mi"
                      production: "1Gi"
              # The limit must stay at or above the request, so patch it with the tier too
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tier
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].resources.limits.memory
                transforms:
                  - type: map
                    map:
                      development: "512Mi"
                      staging: "1Gi"
                      production: "2Gi"
          - name: region-settings
            patches:
              # For cloud provider compositions (e.g. provider-aws), patch region to
              # spec.forProvider.region. For the Kubernetes provider used in this local
              # Kind cluster example, we propagate region as a label instead.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: metadata.labels["platform.io/region"]
        resources:
          # Namespace for the database
          - name: db-namespace
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Namespace
                    metadata:
                      name: databases
                      # Required by the Chapter 11 namespace-must-have-team policy
                      labels:
                        team: platform
                        cost-center: "10001"
                        environment: dev
            patches:
              - type: PatchSet
                patchSetName: common-labels

          # Credentials secret read by the PostgreSQL Deployment. The composition owns it,
          # so it replaces any db-credentials Secret created by hand beforehand.
          # In production, replace this with an ExternalSecret from your secrets manager.
          - name: db-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      name: db-credentials
                      namespace: databases
                    type: Opaque
                    stringData:
                      username: platform
                      # In production use ExternalSecrets or a secrets manager.
                      # This static value is used for the local Kind demo only.
                      password: change-me-in-production
            # connectionDetails: illustrative only; v2 does not publish these (see header).
            connectionDetails:
              - name: username
                type: FromValue
                value: platform
              - name: password
                type: FromValue
                value: change-me-in-production

          # PersistentVolumeClaim for PostgreSQL data
          - name: db-pvc
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: PersistentVolumeClaim
                    metadata:
                      name: postgresql-data
                      namespace: databases
                    spec:
                      accessModes:
                        - ReadWriteOnce
                      resources:
                        requests:
                          storage: 20Gi

          # PostgreSQL Deployment
          - name: db-deployment
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      name: postgresql
                      namespace: databases
                      labels:
                        app: postgresql
                        platform.io/managed-by: crossplane
                    spec:
                      replicas: 1
                      selector:
                        matchLabels:
                          app: postgresql
                      template:
                        metadata:
                          labels:
                            app: postgresql
                        spec:
                          containers:
                            - name: postgresql
                              # Fully qualified: the allowed-registries policy matches the
                              # "docker.io/" prefix, so a bare "postgres:..." is rejected
                              image: docker.io/library/postgres:15-alpine
                              ports:
                                - containerPort: 5432
                              env:
                                - name: POSTGRES_DB
                                  value: platformdb
                                - name: POSTGRES_USER
                                  value: platform
                                - name: POSTGRES_PASSWORD
                                  valueFrom:
                                    secretKeyRef:
                                      name: db-credentials
                                      key: password
                                - name: PGDATA
                                  value: /var/lib/postgresql/data/pgdata
                              resources:
                                requests:
                                  cpu: 100m
                                  memory: 256Mi
                                limits:
                                  cpu: 500m
                                  memory: 512Mi
                              volumeMounts:
                                - name: data
                                  mountPath: /var/lib/postgresql/data
                              readinessProbe:
                                exec:
                                  command:
                                    - pg_isready
                                    - -U
                                    - platform
                                initialDelaySeconds: 5
                                periodSeconds: 10
                          volumes:
                            - name: data
                              persistentVolumeClaim:
                                claimName: postgresql-data
            patches:
              - type: PatchSet
                patchSetName: common-labels
              - type: PatchSet
                patchSetName: tier-settings
              - type: PatchSet
                patchSetName: region-settings
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.version
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].image
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "docker.io/library/postgres:%s-alpine"

          # Service to expose PostgreSQL. The application's connection secret
          # (endpoint, port, username, password) is composed by app-connection-secret below.
          - name: db-service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
                    metadata:
                      name: postgresql
                      namespace: databases
                      labels:
                        app: postgresql
                    spec:
                      type: ClusterIP
                      ports:
                        - port: 5432
                          targetPort: 5432
                          protocol: TCP
                      selector:
                        app: postgresql
            # connectionDetails: the function collects endpoint + port here and merges them
            # with username + password from db-secret. The result is one unified secret.
            connectionDetails:
              - name: endpoint
                type: FromValue
                value: postgresql.databases.svc.cluster.local
              - name: port
                type: FromValue
                value: "5432"

          # Connection secret for the application, in the Claim's own namespace.
          # Crossplane v2 no longer creates this from connectionDetails (the
          # Composition has no writeConnectionSecretsToNamespace), so the composition
          # composes the Secret itself. Its name and namespace come from the Claim.
          - name: app-connection-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      name: placeholder        # patched to <claim-name>-connection
                      namespace: placeholder   # patched to the Claim's namespace
                    type: Opaque
                    stringData:
                      endpoint: postgresql.databases.svc.cluster.local
                      port: "5432"
                      username: platform
                      # Same static demo value as db-secret above
                      password: change-me-in-production
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.claimRef.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-connection"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.claimRef.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace
