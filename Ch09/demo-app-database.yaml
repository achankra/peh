# demo-app/infrastructure/database.yaml
# PostgreSQL claim for the demo application
# This demonstrates how teams request databases through simple configuration

apiVersion: database.platform.io/v1alpha1
kind: PostgreSQLClaim
metadata:
  name: demo-app-db
  namespace: team-alpha
  labels:
    platform.io/team: team-alpha
    platform.io/owner: demo-app
    platform.io/cost-center: engineering
spec:
  # Several compositions implement PostgreSQLInstance (Phase 4 adds one per
  # environment); without a selector Crossplane picks one of them arbitrarily.
  compositionSelector:
    matchLabels:
      database: postgresql
  parameters:
    storageGB: 20
    version: "15"
    tier: development
    enableBackups: true
  # No connection-secret field here: Crossplane v2 does not propagate one to the claim.
  # The composition creates the Secret "demo-app-db-connection" (<claim-name>-connection)
  # in this namespace instead.
